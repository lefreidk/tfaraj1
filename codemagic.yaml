workflows:
  tfaraj-android:
    name: TFARAJ Android
    max_build_duration: 60

    instance_type: linux_x2

    environment:
      flutter: stable

      vars:
        PACKAGE_NAME: "com.tfaraj.app"

      android_signing:
        - tfaraj_keystore

      groups:
        - firebase

    scripts:
      - name: Get Flutter packages
        script: |
          flutter pub get

      - name: Analyze Flutter project
        script: |
          flutter analyze

      - name: Build APK
        script: |
          flutter build apk --release

      - name: Build AAB
        script: |
          flutter build appbundle --release

    artifacts:
      - build/app/outputs/flutter-apk/*.apk
      - build/app/outputs/bundle/release/*.aab

    publishing:
      email:
        recipients:
          - lefreidk@gmail.com
        notify:
          success: true
          failure: true